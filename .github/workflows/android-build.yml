name: Build TAQI GAMES Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/player.gd
          mkdir -p build
      - name: Export Android APK
        run: godot --headless --verbose --path . --export-debug "Android" build/TAQI-GAMES.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAQI-GAMES-Android-APK
          path: build/TAQI-GAMES.apk
          if-no-files-found: error
