name: Build TAQI GAMES Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main.tscn
          test -f scripts/player.gd

      - name: Install Java and Android SDK
        run: |
          set -e
          apt-get update
          apt-get install -y openjdk-17-jdk unzip wget curl ca-certificates

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-commandline-tools.zip
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/android-commandline-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true

          # Godot 4.3 targets API 34 / build-tools 34.0.0 by default
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Godot 4.3 export templates
        run: |
          set -e
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Create debug keystore
        run: |
          set -e
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$(which keytool)")")")"
          echo "JAVA_HOME_DIR=$JAVA_HOME_DIR"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore /root/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12
          echo "$JAVA_HOME_DIR" > /tmp/java_home

      - name: Enable ETC2/ASTC import (required for Android export)
        run: |
          if ! grep -q 'import_etc2_astc' project.godot; then
            if grep -q '^\[rendering\]' project.godot; then
              sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
            else
              printf '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n' >> project.godot
            fi
          fi
          grep -n -A2 'rendering' project.godot || true

      - name: Configure Godot Android paths
        run: |
          set -e
          export JAVA_HOME="$(cat /tmp/java_home)"
          mkdir -p "$HOME/.config/godot"
          # Let Godot create its editor settings file (4.3 uses editor_settings-4.3.tres)
          godot --headless --editor --path . --quit || true
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          # remove any old values, then append ours
          sed -i '/^export\/android\//d' "$SETTINGS"
          cat >> "$SETTINGS" <<EOF
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^[[:space:]]*export\/android/export\/android/' "$SETTINGS"
          tail -n 8 "$SETTINGS"

      - name: Import project and export Android APK
        shell: bash
        run: |
          set -eo pipefail
          export JAVA_HOME="$(cat /tmp/java_home)"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          mkdir -p build
          godot --headless --editor --path . --quit
          # Show the REAL error lines if the export fails
          godot --headless --path . --export-debug "Android" build/TAQI-GAMES.apk 2>&1 | tee export.log
          grep -E "ERROR|SCRIPT ERROR" export.log || true

      - name: Verify APK
        run: |
          test -s build/TAQI-GAMES.apk
          ls -lh build/TAQI-GAMES.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAQI-GAMES-Android-APK
          path: build/TAQI-GAMES.apk
          if-no-files-found: error
